<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuyurAbi | Yeni Nesil Dijital Adisyon & Kasa Otomasyon Sistemi</title>
  <meta name="description"
    content="BuyurAbi Dijital Adisyon Programı: Masadan QR ile garson çağırma, cep telefonuyla anlık sipariş girişi, mutfak sıcak ekranı, masa hesabı ve gelişmiş kasa yönetimi.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <!-- Ambient Background Lights -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <!-- Header / Navigation Bar -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-logo" id="logo-btn" title="BuyurAbi Dijital Adisyon & Kasa">
        <div class="logo-icon">
          <i data-lucide="receipt"></i>
        </div>
        <div class="logo-text">
          <span class="brand-name">Buyur<span class="brand-accent">Abi</span></span>
          <span class="brand-sub">DİJİTAL ADİSYON & KASA SİSTEMİ</span>
        </div>
      </div>

      <!-- Navigation Links (PUBLIC SITE - ONLY TANITIM & KAYIT OL) -->
      <nav class="main-nav">
        <button class="nav-btn active" data-view="landing" id="nav-landing-btn">
          <i data-lucide="sparkles"></i>
          <span>Tanıtım Sayfası</span>
        </button>

        <button class="nav-btn" data-view="register" id="nav-register-btn">
          <i data-lucide="store"></i>
          <span>Kayıt Ol</span>
        </button>
      </nav>

      <!-- Quick Action Header Button -->
      <div class="header-actions" style="display:flex; align-items:center; gap:0.75rem;">
        <button class="btn-header-register" id="btn-header-cta">
          <i data-lucide="zap"></i>
          <span>İşletmeni Kaydet</span>
        </button>

        <!-- Profil Butonu -->
        <div id="header-profile-area" style="position:relative;">
          <button id="btn-header-profile" class="header-profile-btn" title="Profil">
            <i data-lucide="user-circle" id="header-profile-icon" style="width:22px; height:22px;"></i>
            <span id="header-profile-label">Profil Aç</span>
          </button>
          <!-- Dropdown -->
          <div id="header-profile-dropdown" class="header-profile-dropdown" style="display:none;">
            <div id="dropdown-profile-info" class="dropdown-profile-info"></div>
            <button id="btn-dropdown-edit-profile" class="dropdown-item">
              <i data-lucide="user-pen" style="width:15px; height:15px;"></i> Profili Düzenle
            </button>
            <button id="btn-dropdown-applications" class="dropdown-item">
              <i data-lucide="clipboard-list" style="width:15px; height:15px;"></i> Başvurularım
              <span id="badge-dropdown-app-count" style="display:none; background:var(--color-primary); color:#fff; font-size:0.7rem; font-weight:800; padding:2px 7px; border-radius:10px; margin-left:auto;">0</span>
            </button>
            <button id="btn-dropdown-logout" class="dropdown-item dropdown-item-danger">
              <i data-lucide="log-out" style="width:15px; height:15px;"></i> Çıkış Yap
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- BAŞVURULARIM MODAL -->
  <div id="modal-my-applications-backdrop" class="modal-backdrop" style="display:none;">
    <div class="modal-card-app">
      <div class="modal-card-header">
        <div style="display:flex; align-items:center; gap:0.6rem;">
          <div style="width:36px; height:36px; border-radius:10px; background:rgba(255,107,0,0.15); color:var(--color-primary); display:flex; align-items:center; justify-content:center;">
            <i data-lucide="clipboard-list" style="width:20px; height:20px;"></i>
          </div>
          <div>
            <h3 style="margin:0; font-family:var(--font-heading); font-size:1.25rem; font-weight:800; color:#fff;">İşletme Başvurularım</h3>
            <span style="font-size:0.75rem; color:var(--color-text-muted);">Kayıtlı restoran başvurularınız ve onay durumları</span>
          </div>
        </div>
        <button id="btn-close-app-modal" class="modal-close-btn" title="Kapat">
          <i data-lucide="x" style="width:18px; height:18px;"></i>
        </button>
      </div>

      <div id="modal-applications-body" class="modal-card-body">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Main Content Container -->
  <main class="app-main-content">
    <section id="view-landing" class="view-section active"></section>
    <section id="view-register" class="view-section"></section>
  </main>

  <!-- Global Footer -->
  <footer class="app-footer">
    <div class="footer-content">
      <div class="footer-brand">
        <div class="logo-icon small">
          <i data-lucide="receipt"></i>
        </div>
        <span><strong>BuyurAbi</strong> Restoran Dijital Adisyon & Kasa Otomasyonu © 2026</span>
      </div>
      <div class="footer-links">
        <span><i data-lucide="shield-check"></i> 256-Bit SSL Güvenli Altyapı</span>
        <span><i data-lucide="headphones"></i> 7/24 Destek: 0538 447 8410</span>
      </div>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
